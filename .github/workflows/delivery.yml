# Delivery: builds, scans and pushes ghcr.io/privacybydesign/irma_keyshare_webclient.
# Push to master -> :edge, release vX.Y.Z -> :X.Y.Z, :X.Y, :X and :latest,
# manual run -> :<branch> (plus :edge on master). PR builds are scanned in
# Status checks; published images are re-scanned weekly by image-rescan.yml.
name: Delivery

on:
  push:
    branches: [master]
  release:
    types: [published]
  workflow_dispatch:

permissions: {}

jobs:
  docker:
    uses: privacybydesign/github-workflows/.github/workflows/docker-publish.yml@v1
    permissions:
      contents: read
      packages: write
      security-events: write
      id-token: write
      attestations: write
    with:
      # The old Release workflow tagged :X.Y.Z, :X.Y, :X and :latest on every
      # stable release; keep doing so.
      tag-latest: true
      tag-semver-rollups: true
      # The old Delivery and Release workflows refused to publish with fixable
      # high (or worse) vulnerabilities; keep that gate.
      scan-severity-cutoff: high
