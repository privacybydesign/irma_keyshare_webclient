# Delivery builds and pushes the :edge image to GHCR.
#
# Triggers:
#   - push to master      → automatic :edge after every merge
#   - workflow_dispatch   → manual :edge build from any branch (lets you cut
#                           an :edge off a PR branch to test the deployment
#                           path before merging)
#
# Both paths run the same Anchore scan before pushing, so :edge is never
# published from an unscanned source — workflow_dispatch from a PR branch
# still goes through the same vulnerability gate that ci.yml uses on PRs
# (with fail-build: true here, since publishing has no PR-style escape
# hatch). Tagged releases (:X.Y.Z) live in release.yml.

name: Delivery

on:
  push:
    branches: [master]
  workflow_dispatch:

# Serialise :edge publishes so two near-simultaneous merges to master (or a
# merge plus a manual workflow_dispatch) can't race on the GHCR push. Don't
# cancel in flight — the in-flight push already represents committed code
# that we want shipped.
concurrency:
  group: delivery-edge
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  security-events: write

jobs:
  publish-edge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Docker rejects uppercase characters in image tags. github.repository
      # is mixed-case if the org/repo name has any.
      - name: Compute lowercase image name
        id: image
        env:
          REPO: ${{ github.repository }}
        run: |
          printf 'name=%s\n' "$(echo "$REPO" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
        with:
          images: ghcr.io/${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=edge

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Single-build, scan-then-push pattern. One docker/build-push-action
      # call produces the local image; the same image (identical digest, by
      # definition) is then tagged and pushed. An earlier iteration ran two
      # build-push-action calls relying on GHA cache to converge on the same
      # digest — theoretically robust, but no digest verification, so a
      # cache divergence could publish an unscanned artifact past the gate.
      - name: Build image locally with labels baked in
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          load: true
          tags: local/${{ steps.image.outputs.name }}:scan
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Same gate as release.yml: fixable highs+ fail the build. An :edge
      # publish has no PR-style escape hatch, so the gate is unconditional
      # here. Note this duplicates ci.yml's scan on master-push runs; the
      # GHA cache makes the second build cheap, and having delivery own its
      # own gate means workflow_dispatch from any branch (including PR
      # branches that bypass ci.yml) still goes through the same check.
      - name: Scan image with Anchore
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        id: scan
        with:
          image: local/${{ steps.image.outputs.name }}:scan
          only-fixed: true
          fail-build: true
          severity-cutoff: high
          output-format: sarif

      - name: Upload Anchore scan SARIF report
        uses: github/codeql-action/upload-sarif@f52b05f4acaaa234e44466e66d29050e135ea9ef # v4.36.0
        if: ${{ !cancelled() }}
        with:
          sarif_file: ${{ steps.scan.outputs.sarif }}

      # Tag the scanned image with the final GHCR tags and push. Each push
      # uses the exact bytes Anchore just scanned (same content-addressable
      # digest). Non-atomic for multi-tag pushes, but delivery only pushes
      # a single :edge tag so that's moot here.
      - name: Tag and push scanned image to GHCR
        env:
          SCAN_IMAGE: local/${{ steps.image.outputs.name }}:scan
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            docker tag "$SCAN_IMAGE" "$tag"
            docker push "$tag"
          done <<< "$TAGS"
