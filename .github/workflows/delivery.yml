# Delivery builds and pushes the :edge image to GHCR.
#
# Triggers:
#   - push to master      → automatic :edge after every merge
#   - workflow_dispatch   → manual :edge build from any branch (lets you cut
#                           an :edge off a PR branch to test the deployment
#                           path before merging)
#
# Code-quality + vulnerability gating lives in ci.yml. Tagged releases
# (:X.Y.Z) live in release.yml.

name: Delivery

on:
  push:
    branches: [master]
  workflow_dispatch:

# Serialise :edge publishes so two near-simultaneous merges to master (or a
# merge plus a manual workflow_dispatch) can't race on the GHCR push. Don't
# cancel in flight — the in-flight push already represents committed code
# that we want shipped.
concurrency:
  group: delivery-edge
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  publish-edge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Docker rejects uppercase characters in image tags. github.repository
      # is mixed-case if the org/repo name has any.
      - name: Compute lowercase image name
        id: image
        env:
          REPO: ${{ github.repository }}
        run: |
          printf 'name=%s\n' "$(echo "$REPO" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push :edge
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          push: true
          tags: ghcr.io/${{ steps.image.outputs.name }}:edge
          cache-from: type=gha
          cache-to: type=gha,mode=max
