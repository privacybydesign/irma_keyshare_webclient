# Release publishes a versioned image to GHCR when a GitHub Release is
# published. Tag `vX.Y.Z` on the release produces image tags :X.Y.Z, :X.Y,
# :X, and :latest.
#
# Pre-releases are explicitly skipped (`if: !github.event.release.prerelease`
# on the publish job). The `release: published` trigger fires for both
# stable and pre-release publishes, but our tag set includes `:latest` and
# unconditional semver patterns — without the guard, publishing
# `v2.0.0-rc.1` would clobber `:latest` and the stable `:2.0.0` / `:2.0` /
# `:2` tags with the RC image, which is rarely what anyone wants. If RC
# tagging is ever needed, add a dedicated pre-release path that pushes
# only the full RC tag (`:2.0.0-rc.1`) and skips the bare-major / minor /
# latest rollups.
#
# Code-quality + vulnerability gating happens in ci.yml before the merge;
# this workflow just stamps the artifact. Edit-after-publish on a release
# will not retag the image — re-publishing or running this workflow manually
# is required to refresh tags.

name: Release

on:
  release:
    types: [published]

# Serialise per-release-tag so a re-publish of the same release can't race
# with the original publish (docker/build-push-action + the meta-action
# resolve to the same tag set, so a parallel run would step on the
# published image).
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  security-events: write

jobs:
  publish-release:
    runs-on: ubuntu-latest
    # Skip pre-releases — see the header comment above. A `v2.0.0-rc.1`
    # publish has `release.prerelease == true`; with `:latest` and the
    # unconditional semver rollups in the meta-action step below, letting
    # such a publish through would overwrite the stable tag set.
    if: ${{ !github.event.release.prerelease }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Compute lowercase image name
        id: image
        env:
          REPO: ${{ github.repository }}
        run: |
          printf 'name=%s\n' "$(echo "$REPO" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
        with:
          images: ghcr.io/${{ steps.image.outputs.name }}
          tags: |
            type=semver,pattern={{major}}.{{minor}}.{{patch}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      # See delivery.yml for the github.repository_owner rationale.
      - name: Login to GitHub Container Registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Single-build, scan-then-push pattern: build once locally, scan that
      # exact image, then tag-and-push the same bytes for every final GHCR
      # tag. An earlier iteration ran two build-push-action calls relying
      # on GHA cache to converge on the same digest — theoretically robust
      # but unverifiable, so a cache divergence could publish an unscanned
      # artifact past the gate. The trade-off is that pushing multiple
      # tags is non-atomic (a partial failure leaves the registry with a
      # subset of the tag set), which is acceptable here: release workflow
      # is manual + rerunnable, and a partial-push failure surfaces in CI
      # logs.
      - name: Build image locally with labels baked in
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          load: true
          tags: local/${{ steps.image.outputs.name }}:scan
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Same gate as ci.yml: fixable highs+ fail the build. A release must
      # clear the bar — there's no PR-style escape hatch here.
      - name: Scan image with Anchore
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        id: scan
        with:
          image: local/${{ steps.image.outputs.name }}:scan
          only-fixed: true
          fail-build: true
          severity-cutoff: high
          output-format: sarif

      - name: Upload Anchore scan SARIF report
        uses: github/codeql-action/upload-sarif@f52b05f4acaaa234e44466e66d29050e135ea9ef # v4.36.0
        if: ${{ !cancelled() }}
        with:
          sarif_file: ${{ steps.scan.outputs.sarif }}

      # Tag the scanned image with every final GHCR tag and push each. All
      # tags reference the same content-addressable digest — by definition
      # the scanned bytes are the published bytes.
      - name: Tag and push scanned image to GHCR
        env:
          SCAN_IMAGE: local/${{ steps.image.outputs.name }}:scan
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            docker tag "$SCAN_IMAGE" "$tag"
            docker push "$tag"
          done <<< "$TAGS"
