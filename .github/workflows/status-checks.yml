# Runs lint on every push to master and every PR. The build is exercised by the
# Delivery workflow, which performs a real Docker build (+ vulnerability scan) on
# every PR — duplicating yarn build here would just be slower feedback.

name: Status checks

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Use Node.js 24
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: 'yarn'
      - run: yarn install
      - run: yarn lint
