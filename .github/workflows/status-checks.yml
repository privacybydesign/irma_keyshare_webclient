# This workflow will do a clean install of all dependencies,
# run the linter to check for issues and the build the source code as a test.

name: Status checks

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Use Node.js 24
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: 'yarn'
      - run: yarn install
      - run: yarn lint

  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Use Node.js 24
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: 'yarn'
      - run: yarn install
      # CI=false: bypass react-scripts treating warnings as errors. The only
      # warnings are spurious postcss-calc complaints about modern CSS
      # relative-color syntax — oklch(from <color> calc(l - 0.05) c h) — inside
      # @privacybydesign/yivi-css. The minifier can't parse the calc keyword
      # but preserves the source verbatim in the output, so the build is correct.
      - run: CI=false yarn build
