<!DOCTYPE html>
<!--
  No `lang` attribute on <html> on purpose. src/index.jsx sets it from
  window.config.lang (which resolves via localStorage → navigator.languages
  → "en") before the React tree mounts. The yivi-app-bar switcher then
  mutates it on every change. Hardcoding `lang="en"` here would mislead
  crawlers / pre-JS assistive tech on Dutch-default deployments.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ffffff" />
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/favicons/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicons/favicon-16x16.png">
    <link rel="manifest" href="/assets/favicons/webmanifest.json">
    <link rel="mask-icon" href="/assets/favicons/safari-pinned-tab.svg" color="#e12747">
    <link rel="shortcut icon" href="/assets/favicons/favicon.ico">
    <meta name="msapplication-TileColor" content="#96c5e1">
    <meta name="msapplication-config" content="/assets/favicons/browserconfig.xml">
    <script src="/config.js" type="application/javascript"></script>
    <title>MyYivi</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/index.jsx"></script>
  </body>
</html>
